name: Nightlight Dashboard CI

on:
  pull_request:
    paths:
      - 'project/nightlight-dashboard/**'
      - '.github/workflows/nightlight-dashboard-ci.yml'
  push:
    branches: [main]
    paths:
      - 'project/nightlight-dashboard/**'
      - '.github/workflows/nightlight-dashboard-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: project/nightlight-dashboard
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: project/nightlight-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Analyze bundle boundaries
        run: npm run analyze:bundle
