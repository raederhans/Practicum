name: Deploy Public Observatory to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'project/nightlight-public/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: project/nightlight-public/package-lock.json

      - name: Install dependencies
        working-directory: project/nightlight-public
        run: npm ci

      - name: Test and verify source boundary
        working-directory: project/nightlight-public
        run: npm test && npm run verify:public

      - name: Build for repository base path
        working-directory: project/nightlight-public
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Verify production boundary and release manifest
        working-directory: project/nightlight-public
        run: npm run verify:public -- --require-dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: project/nightlight-public/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
