name: Deploy Public Observatory to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'project/nightlight-public/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: project/nightlight-public/package-lock.json

      - name: Install dependencies
        working-directory: project/nightlight-public
        run: npm ci

      - name: Test and verify source boundary
        working-directory: project/nightlight-public
        run: npm test && npm run verify:public

      - name: Build for repository base path
        working-directory: project/nightlight-public
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Verify production boundary and release manifest
        working-directory: project/nightlight-public
        run: npm run verify:public -- --require-dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: project/nightlight-public/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
